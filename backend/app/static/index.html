<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniPresence ? Phase 1 Android App Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Light Theme Default */
      --bg: #F8F9FC;
      --surface: #FFFFFF;
      --surface-soft: #FAF8FF;
      --surface-tint: #F1EDFF;
      --primary: #6657D9;
      --primary-soft: #EEE9FF;
      --lavender: #C8B5FF;
      --pink: #E8B9E1;
      --cyan: #B8E9EE;
      --text-primary: #171526;
      --text-secondary: #686476;
      --text-muted: #9B98A6;
      --border: #E7E4ED;
      --success: #57B994;
      --warning: #E4A64A;
      --error: #D95B70;
      --phone-shadow: rgba(0, 0, 0, 0.15);
    }

    [data-theme="dark"] {
      --bg: #0B0812;
      --surface: #13101B;
      --surface-soft: #1A1524;
      --surface-tint: #211A31;
      --primary: #A58BFF;
      --primary-soft: #30234A;
      --lavender: #B994FF;
      --pink: #E38CD4;
      --cyan: #72DDE3;
      --text-primary: #F7F4FC;
      --text-secondary: #B9B2C5;
      --text-muted: #80788D;
      --border: #30293A;
      --success: #62D2A0;
      --warning: #E9B35D;
      --error: #F07891;
      --phone-shadow: rgba(165, 139, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.2s, color 0.2s; }

    body {
      background: #0f1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .toolbar {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      align-items: center;
      background: #1b1e2e;
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-toggle {
      background: #6657D9;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .phone-container {
      width: 390px;
      height: 800px;
      background: var(--bg);
      border-radius: 44px;
      border: 12px solid #202433;
      box-shadow: 0 25px 60px var(--phone-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .phone-notch {
      width: 140px;
      height: 24px;
      background: #202433;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 100;
    }

    .app-header {
      padding: 34px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .weather-pill {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      color: var(--text-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .ai-card {
      background: var(--surface-tint);
      border: 1.5px solid var(--lavender);
    }

    .ai-badge {
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .wardrobe-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
    }

    .wardrobe-thumb {
      height: 100px;
      background: var(--surface-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .wardrobe-info {
      padding: 10px;
    }

    .wardrobe-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wardrobe-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .wardrobe-wear {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      width: 100%;
      background: var(--surface-soft);
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .bottom-nav {
      height: 64px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-ai-btn {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: -12px;
      box-shadow: 0 4px 12px rgba(102, 87, 217, 0.4);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
    }

    .pill.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span>OmniPresence Android Simulator</span>
    <button class="btn-toggle" onclick="toggleTheme()">?? Toggle Light/Dark Mode</button>
    <a href="/docs" target="_blank" style="color: #A58BFF; text-decoration: none; font-size: 13px; font-weight: 600;">Swagger API Docs ?</a>
  </div>

  <div class="phone-container" id="phone">
    <div class="phone-notch"></div>
    
    <div class="app-header">
      <h1 id="screen-title">OmniPresence</h1>
      <div class="weather-pill">
        <span>??</span>
        <span id="weather-text">28?C ? Clear</span>
      </div>
    </div>

    <div class="content-area" id="content">
      <!-- Dynamic Views Rendered by JavaScript -->
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" onclick="showScreen('home')">
        <div class="nav-icon">??</div>
        <div>Home</div>
      </div>
      <div class="nav-item" onclick="showScreen('wardrobe')">
        <div class="nav-icon">??</div>
        <div>Wardrobe</div>
      </div>
      <div class="nav-ai-btn" onclick="showScreen('ai')">
        ?
      </div>
      <div class="nav-item" onclick="showScreen('plan')">
        <div class="nav-icon">??</div>
        <div>Plan</div>
      </div>
      <div class="nav-item" onclick="showScreen('profile')">
        <div class="nav-icon">??</div>
        <div>You</div>
      </div>
    </div>
  </div>

  <script>
    let currentTheme = 'light';
    let currentScreen = 'home';
    let wardrobeItems = [
      { id: 1, name: 'White Oxford Shirt', cat: 'Tops', sub: 'Shirts ? Smart Casual', icon: '??', wear: 7, price: 85 },
      { id: 2, name: 'Navy Slim Trousers', cat: 'Bottoms', sub: 'Trousers ? Smart Casual', icon: '??', wear: 4, price: 110 },
      { id: 3, name: 'White Leather Low-Tops', cat: 'Footwear', sub: 'Sneakers ? Casual', icon: '??', wear: 12, price: 130 },
      { id: 4, name: 'Charcoal Crewneck', cat: 'Tops', sub: 'T-Shirts ? Casual', icon: '??', wear: 15, price: 35 },
      { id: 5, name: 'Raw Denim Jeans', cat: 'Bottoms', sub: 'Jeans ? Casual', icon: '??', wear: 9, price: 95 },
      { id: 6, name: 'Wool Overshirt', cat: 'Outerwear', sub: 'Jackets ? Smart Casual', icon: '??', wear: 3, price: 160 }
    ];

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
    }

    function showScreen(screen) {
      currentScreen = screen;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const content = document.getElementById('content');
      const title = document.getElementById('screen-title');

      if (screen === 'home') {
        title.innerText = 'Good Evening, Alex';
        content.innerHTML = `
          <div class="card ai-card">
            <div class="ai-badge">? OP AI Smart Insight</div>
            <div class="card-sub">You haven't worn your <b>White Oxford Shirt</b> in 21 days. It pairs perfectly with your Navy Trousers for tonight's dinner.</div>
            <button class="btn-primary" onclick="showScreen('ai')">? View Recommendation</button>
          </div>

          <div class="card">
            <div class="card-title">Wardrobe Rotation</div>
            <div style="display:flex; justify-content:space-around; margin-top:12px;">
              <div style="text-align:center;">
                <div style="font-size:20px; font-weight:700; color:var(--text-primary);">${wardrobeItems.length}</div>
                <div style="font-size:11px; color:var(--text-muted);">Total Items</div>
              </div>
              <div style="text-align:center;">
                <div style="font-size:20px; font-weight:700; color:var(--success);">94%</div>
                <div style="font-size:11px; color:var(--text-muted);">Ready</div>
              </div>
              <div style="text-align:center;">
                <div style="font-size:20px; font-weight:700; color:var(--warning);">$12.40</div>
                <div style="font-size:11px; color:var(--text-muted);">Avg Cost/Wear</div>
              </div>
            </div>
          </div>

          <button class="btn-secondary" onclick="showScreen('wardrobe')">?? Manage Digital Closet</button>
        `;
      } else if (screen === 'wardrobe') {
        title.innerText = 'My Wardrobe';
        content.innerHTML = `
          <div class="filter-pills">
            <div class="pill active">All (${wardrobeItems.length})</div>
            <div class="pill">Tops</div>
            <div class="pill">Bottoms</div>
            <div class="pill">Footwear</div>
          </div>
          <div class="grid-2">
            ${wardrobeItems.map(item => `
              <div class="wardrobe-item" onclick="markWorn(${item.id})">
                <div class="wardrobe-thumb">${item.icon}</div>
                <div class="wardrobe-info">
                  <div class="wardrobe-name">${item.name}</div>
                  <div class="wardrobe-meta">${item.sub}</div>
                  <div class="wardrobe-wear">Worn ${item.wear} times ? $${(item.price / Math.max(item.wear, 1)).toFixed(2)}/wear</div>
                </div>
              </div>
            `).join('')}
          </div>
          <button class="btn-primary" style="margin-top:16px;" onclick="simulateAdd()">+ Scan / Add Clothing Piece</button>
        `;
      } else if (screen === 'ai') {
        title.innerText = 'OP AI Recommendation';
        content.innerHTML = `
          <div class="card" style="text-align:center;">
            <div style="font-size:48px; margin-bottom:8px;">?? + ?? + ??</div>
            <div style="display:inline-block; background:rgba(87, 185, 148, 0.15); color:var(--success); padding:4px 12px; border-radius:12px; font-weight:700; font-size:12px;">92% Match</div>
            <div class="card-title" style="margin-top:8px;">Curated Dinner Ensemble</div>
            <div class="card-sub">? White Oxford Shirt<br>? Navy Slim Trousers<br>? White Leather Low-Tops</div>
          </div>

          <div class="card ai-card">
            <div class="ai-badge">? Why this works</div>
            <div class="card-sub">Perfect for tonight's 28?C clear dinner event. Balances color harmony and brings forward pieces you haven't worn in 3 weeks to optimize rotation.</div>
          </div>

          <button class="btn-primary" onclick="submitRating('Loved it')">? Wear This Outfit</button>
          <button class="btn-secondary" onclick="submitRating('Fine')">?? Change Items</button>
        `;
      } else if (screen === 'plan') {
        title.innerText = 'Outfit Planner';
        content.innerHTML = `
          <div class="card">
            <div class="card-title">Saturday, Sep 5 ? Dinner Event</div>
            <div class="card-sub">??? 28?C ? Clear Sky (10% rain chance)</div>
          </div>
          <div class="card">
            <div style="font-size:12px; color:var(--text-muted); font-weight:700;">TOP</div>
            <div class="card-title">White Oxford Shirt</div>
            <div class="card-sub">100% Breathable Cotton</div>
          </div>
          <div class="card">
            <div style="font-size:12px; color:var(--text-muted); font-weight:700;">BOTTOM</div>
            <div class="card-title">Navy Slim Trousers</div>
            <div class="card-sub">Smart Casual Stretch Cotton</div>
          </div>
          <div class="card">
            <div style="font-size:12px; color:var(--text-muted); font-weight:700;">FOOTWEAR</div>
            <div class="card-title">White Leather Sneakers</div>
            <div class="card-sub">Italian Nappa Leather</div>
          </div>
          <button class="btn-primary" onclick="showScreen('ai')">? Optimize with OP AI</button>
        `;
      } else if (screen === 'profile') {
        title.innerText = 'Profile & Settings';
        content.innerHTML = `
          <div class="card">
            <div style="display:flex; align-items:center; gap:12px;">
              <div style="width:48px; height:48px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700;">AC</div>
              <div>
                <div class="card-title">Alex Chen</div>
                <div class="card-sub">alex.chen@omnipresence.ai</div>
              </div>
            </div>
            <div style="margin-top:12px; font-size:12px; color:var(--primary); font-weight:600;">Style: Minimal ? Smart Casual</div>
          </div>
          <div class="card">
            <div class="card-title">? AI Personalization</div>
            <div class="card-sub">Active ? Using wear history, weather, and calendar signals to curate outfits.</div>
          </div>
        `;
      }
    }

    function markWorn(id) {
      const item = wardrobeItems.find(i => i.id === id);
      if (item) {
        item.wear += 1;
        alert(`? Marked "${item.name}" as worn! Wear count is now ${item.wear}.`);
        showScreen('wardrobe');
      }
    }

    function simulateAdd() {
      alert('? OP AI scanned image: Detected White Linen Shirt (94% confidence). Added to wardrobe!');
      wardrobeItems.unshift({ id: Date.now(), name: 'White Linen Shirt', cat: 'Tops', sub: 'Shirts ? Casual', icon: '??', wear: 1, price: 55 });
      showScreen('wardrobe');
    }

    function submitRating(type) {
      alert(`? Feedback submitted ("${type}"). Preference weights updated for future recommendations!`);
      showScreen('home');
    }

    // Initialize
    showScreen('home');
  </script>
</body>
</html>
